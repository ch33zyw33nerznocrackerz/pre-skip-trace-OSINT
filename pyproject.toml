[project]
name = "service-osint"
version = "0.9.0"
description = "Lawful individual skip-trace OSINT helper for process servers"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.5",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.8.2",
  "playwright>=1.45.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
]

[project.scripts]
osint = "service_osint.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service_osint"]
